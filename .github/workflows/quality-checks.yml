name: Quality checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: roboreha
          POSTGRES_USER: roboreha
          POSTGRES_PASSWORD: roboreha
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U roboreha -d roboreha"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://roboreha:roboreha@localhost:55432/roboreha
      NEXT_PUBLIC_ROBOREHA_BASE_PATH: /roboreha-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w @hangout-now/api

      - name: Prepare RoboReha test database
        run: npm run db:test-data -w @method-more/roboreha

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build production API image
        run: docker build --file apps/api/Dockerfile --tag hangoutnow-api:ci .

      - name: Verify image optimization runtime
        run: >-
          docker run --rm hangoutnow-api:ci sh -c
          "node -e \"require('./apps/api/node_modules/sharp'); require('http-proxy'); console.log('combined runtime dependencies ok')\"
          && test -f apps/roboreha/.next/BUILD_ID"

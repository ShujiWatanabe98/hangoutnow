services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: hangoutnow
      POSTGRES_USER: hangout
      POSTGRES_PASSWORD: hangout
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hangout -d hangoutnow"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://hangout:hangout@postgres:5432/hangoutnow?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: local-demo-secret-change-before-deployment
      ADMIN_API_TOKEN: local-admin-demo-token-change-me
      PHONE_CODE_SECRET: local-phone-code-secret-change-me
      PORT: 3000
    command: ["sh", "-c", "npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && node apps/api/dist/src/main.js"]
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  postgres_data:

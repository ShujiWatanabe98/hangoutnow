<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head th:replace="common :: meta_header"></head>
<head>
	<title>療法士一覧 | Smart Rehab</title>
	<link href="/rehainfo/schedule/therapists.css?v=1.4.0" rel="stylesheet" />
	<script src="/rehainfo/schedule/therapists.js?v=1.4.0" defer="defer"></script>
</head>
<body>
	<main id="therapist-directory-page">
		<div th:replace="common :: topHeader"></div>
		<div th:replace="common :: loading"></div>
		<section class="directory-shell">
			<div class="directory-title-row">
				<div><h1>療法士一覧</h1><p>リハビリを担当する療法士の登録・確認を行います</p></div>
				<button id="addTherapistButton" class="btn directory-primary-button" type="button"><i class="bi bi-person-plus"></i> 療法士を登録</button>
			</div>
			<div id="therapistAlert" class="directory-alert d-none" role="alert"></div>
			<div class="directory-toolbar">
				<label for="therapistSearch"><i class="bi bi-search"></i></label>
				<input id="therapistSearch" type="search" placeholder="療法士ID・氏名・職種で検索" />
				<div class="target-month-control"><label for="targetMonth">目標対象月</label><input id="targetMonth" type="month" /></div>
				<span>登録数 <strong id="therapistCount">0</strong>名</span>
			</div>
			<div class="directory-table-frame">
				<table class="directory-table">
					<thead><tr><th>療法士ID</th><th>氏名</th><th>氏名カナ</th><th>職種</th><th>勤務形態</th><th>月の目標単位</th><th>電話番号</th><th>メールアドレス</th><th>担当患者</th></tr></thead>
					<tbody id="therapistTableBody"></tbody>
				</table>
			</div>
		</section>
	</main>
	<div class="modal fade" id="therapistModal" tabindex="-1" aria-labelledby="therapistModalTitle" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered"><div class="modal-content directory-modal-content">
			<div class="modal-header"><div><small>療法士台帳</small><h2 id="therapistModalTitle">療法士を登録</h2></div><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button></div>
			<div class="modal-body">
				<div class="form-grid"><div><label for="therapistId">療法士ID <span>必須</span></label><input id="therapistId" class="form-control" maxlength="12" /></div><div><label for="therapistRole">職種 <span>必須</span></label><select id="therapistRole" class="form-select"><option value="PT">PT</option><option value="OT">OT</option><option value="ST">ST</option></select></div></div>
				<div class="form-row"><label for="therapistName">氏名 <span>必須</span></label><input id="therapistName" class="form-control" maxlength="40" /></div>
				<div class="form-row"><label for="therapistKana">氏名カナ</label><input id="therapistKana" class="form-control" maxlength="60" /></div>
				<div class="form-grid"><div><label for="therapistEmployment">勤務形態</label><select id="therapistEmployment" class="form-select"><option value="常勤">常勤</option><option value="非常勤">非常勤</option></select></div><div><label for="therapistPhone">電話番号</label><input id="therapistPhone" class="form-control" maxlength="20" /></div></div>
				<div class="form-row"><label for="therapistEmail">メールアドレス</label><input id="therapistEmail" class="form-control" type="email" maxlength="80" /></div>
				<div id="therapistValidation" class="modal-validation d-none"></div>
			</div>
			<div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">キャンセル</button><button id="saveTherapistButton" type="button" class="btn directory-primary-button">登録</button></div>
		</div></div>
	</div>
	<div class="modal fade" id="assignedPatientsModal" tabindex="-1" aria-labelledby="assignedPatientsModalTitle" aria-hidden="true">
		<div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable"><div class="modal-content directory-modal-content">
			<div class="modal-header"><div><small>全期間の担当状況</small><h2 id="assignedPatientsModalTitle">担当患者</h2></div><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button></div>
			<div class="modal-body">
				<section class="patient-assignment-section">
					<div class="patient-assignment-heading"><div><h3>予約がある患者</h3><p>対象月に関係なく、この療法士に予約が登録されている患者です</p></div><span id="scheduledPatientsCount" class="patient-count-badge">0名</span></div>
					<p id="assignedPatientsSummary" class="assigned-patients-summary"></p>
					<div class="assigned-patients-table-frame"><table class="assigned-patients-table">
						<thead><tr><th>患者ID</th><th>患者氏名</th><th>区分</th><th>病棟</th><th>予約件数</th><th>合計単位</th><th>初回日</th><th>最終日</th></tr></thead>
						<tbody id="assignedPatientsTableBody"></tbody>
					</table></div>
					<div class="patient-list-toggle-wrap"><button id="reservationPatientsToggle" class="patient-list-toggle d-none" type="button" data-section="reservation" aria-expanded="false"></button></div>
				</section>
				<section class="patient-assignment-section">
					<div class="patient-assignment-heading"><div><h3>予約なし患者</h3><p>予約とは別に、この療法士の担当として設定した患者です</p></div><span id="assignedWithoutReservationsCount" class="patient-count-badge">0名</span></div>
					<div class="assigned-patients-table-frame"><table class="assigned-patients-table compact-patient-table">
						<thead><tr><th>患者ID</th><th>患者氏名</th><th>区分</th><th>病棟</th></tr></thead>
						<tbody id="assignedWithoutReservationsBody"></tbody>
					</table></div>
					<div class="patient-list-toggle-wrap"><button id="noReservationPatientsToggle" class="patient-list-toggle d-none" type="button" data-section="noReservation" aria-expanded="false"></button></div>
				</section>
				<section class="patient-assignment-section">
					<div class="patient-assignment-heading"><div><h3>患者一覧</h3><p>この療法士の過去の担当実績から、担当候補を上位に表示しています</p></div><span id="unassignedPatientsCount" class="patient-count-badge">0名</span></div>
					<div class="assigned-patients-table-frame"><table class="assigned-patients-table candidate-patient-table">
						<thead><tr><th>患者ID</th><th>患者氏名</th><th>区分</th><th>病棟</th><th>候補理由</th><th>操作</th></tr></thead>
						<tbody id="unassignedPatientsBody"></tbody>
					</table></div>
					<div class="patient-list-toggle-wrap"><button id="patientCandidatesToggle" class="patient-list-toggle d-none" type="button" data-section="candidates" aria-expanded="false"></button></div>
				</section>
			</div>
			<div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">閉じる</button></div>
		</div></div>
	</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head th:replace="common :: meta_header"></head>
<head>
	<title>療法士一覧 | Smart Rehab</title>
	<link href="/rehainfo/schedule/therapists.css?v=1.1.0" rel="stylesheet" />
	<script src="/rehainfo/schedule/therapists.js?v=1.1.0" defer="defer"></script>
</head>
<body>
	<main id="therapist-directory-page">
		<div th:replace="common :: topHeader"></div>
		<div th:replace="common :: loading"></div>
		<section class="directory-shell">
			<div class="directory-title-row">
				<div><h1>療法士一覧</h1><p>リハビリを担当する療法士の登録・確認を行います</p></div>
				<button id="addTherapistButton" class="btn directory-primary-button" type="button"><i class="bi bi-person-plus"></i> 療法士を登録</button>
			</div>
			<div id="therapistAlert" class="directory-alert d-none" role="alert"></div>
			<div class="directory-toolbar">
				<label for="therapistSearch"><i class="bi bi-search"></i></label>
				<input id="therapistSearch" type="search" placeholder="療法士ID・氏名・職種で検索" />
				<div class="target-month-control"><label for="targetMonth">対象月</label><input id="targetMonth" type="month" /></div>
				<span>登録数 <strong id="therapistCount">0</strong>名</span>
			</div>
			<div class="directory-table-frame">
				<table class="directory-table">
					<thead><tr><th>療法士ID</th><th>氏名</th><th>氏名カナ</th><th>職種</th><th>勤務形態</th><th>月の目標単位</th><th>電話番号</th><th>メールアドレス</th></tr></thead>
					<tbody id="therapistTableBody"></tbody>
				</table>
			</div>
		</section>
	</main>
	<div class="modal fade" id="therapistModal" tabindex="-1" aria-labelledby="therapistModalTitle" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered"><div class="modal-content directory-modal-content">
			<div class="modal-header"><div><small>療法士台帳</small><h2 id="therapistModalTitle">療法士を登録</h2></div><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button></div>
			<div class="modal-body">
				<div class="form-grid"><div><label for="therapistId">療法士ID <span>必須</span></label><input id="therapistId" class="form-control" maxlength="12" /></div><div><label for="therapistRole">職種 <span>必須</span></label><select id="therapistRole" class="form-select"><option value="PT">PT</option><option value="OT">OT</option><option value="ST">ST</option></select></div></div>
				<div class="form-row"><label for="therapistName">氏名 <span>必須</span></label><input id="therapistName" class="form-control" maxlength="40" /></div>
				<div class="form-row"><label for="therapistKana">氏名カナ</label><input id="therapistKana" class="form-control" maxlength="60" /></div>
				<div class="form-grid"><div><label for="therapistEmployment">勤務形態</label><select id="therapistEmployment" class="form-select"><option value="常勤">常勤</option><option value="非常勤">非常勤</option></select></div><div><label for="therapistPhone">電話番号</label><input id="therapistPhone" class="form-control" maxlength="20" /></div></div>
				<div class="form-row"><label for="therapistEmail">メールアドレス</label><input id="therapistEmail" class="form-control" type="email" maxlength="80" /></div>
				<div id="therapistValidation" class="modal-validation d-none"></div>
			</div>
			<div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">キャンセル</button><button id="saveTherapistButton" type="button" class="btn directory-primary-button">登録</button></div>
		</div></div>
	</div>
</body>
</html>

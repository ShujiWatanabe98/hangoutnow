<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="ja"><head th:replace="common :: meta_header"></head><head><title>運用管理・集計 | Smart Rehab</title><link href="/rehainfo/schedule/operations.css?v=1.1.0" rel="stylesheet"/><script src="/rehainfo/schedule/operations.js?v=1.1.0" defer="defer"></script></head><body><main><div th:replace="common :: topHeader"></div><section class="ops-shell">
<header class="ops-toolbar"><a href="/rehainfo/schedule">← スケジュール</a><input id="opsMonth" type="month"/><span id="roleBadge"></span><span id="approvalBadge"></span><button id="approveMonth">月次承認</button><button onclick="window.print()">印刷</button><a id="therapistCsv">療法士CSV</a><a id="hospitalCsv">病院CSV</a><a id="patientCsv">患者CSV</a></header>
<div id="opsMessage" class="ops-message d-none"></div><section class="totals" id="totals"></section>
<nav class="ops-tabs"><button class="active" data-tab="therapists">療法士別集計</button><button data-tab="hospitals">病院別集計</button><button data-tab="patients">患者別集計</button><button data-tab="pending">未処理一覧</button><button data-tab="history">変更履歴</button><button data-tab="integration">外部連携</button></nav>
<section id="therapists" class="tab-panel active"><h2>療法士別 月次算定</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>職種・療法士</th><th>予約件数</th><th>予約単位</th><th>コード済</th><th>未コード</th><th>予定算定点数</th><th>確定算定点数</th><th>稼働率</th></tr></thead><tbody></tbody></table></div></section>
<section id="hospitals" class="tab-panel"><h2>病院別 月次算定</h2><div class="table-wrap"><table><thead><tr><th>サービスID</th><th>病院・グループID</th><th>予約件数</th><th>予約単位</th><th>コード済</th><th>未コード</th><th>予定算定点数</th><th>確定算定点数</th></tr></thead><tbody></tbody></table></div></section>
<section id="patients" class="tab-panel"><h2>患者別 月次実績</h2><div class="table-wrap"><table><thead><tr><th>患者ID</th><th>患者名</th><th>予約件数</th><th>予約単位</th><th>実施単位</th><th>中止単位</th></tr></thead><tbody></tbody></table></div></section>
<section id="pending" class="tab-panel"><h2>未実施・未記録・未算定</h2><p id="pendingCount"></p><div class="table-wrap"><table><thead><tr><th>日付</th><th>時刻</th><th>患者</th><th>療法士</th><th>単位</th><th>ORCAコード</th><th>予定点数</th><th>状態</th></tr></thead><tbody></tbody></table></div></section>
<section id="history" class="tab-panel"><h2>変更履歴</h2><div class="table-wrap"><table><thead><tr><th>変更日時</th><th>操作</th><th>状態</th><th>患者</th><th>療法士</th><th>内容</th><th>変更者</th></tr></thead><tbody></tbody></table></div></section>
<section id="integration" class="tab-panel"><h2>外部連携</h2><p>電子カルテ・医事会計連携用の読み取り専用JSONです。</p><a id="integrationApi" target="_blank">連携JSON APIを開く</a><pre id="integrationPreview"></pre></section>
</section></main></body></html>

<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="ja" >
<head>
<link rel="icon" href="/rehainfo/images/intep360.ico?v=1.0.0" type="image/x-icon" />
<meta charset="UTF-8" />
<title>ログイン</title>
<!--[if lt IE 9]>
<script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
<![endif]-->

    <!-- Bootstrap core CSS -->
  <link href="/rehainfo/css/bootstrap.min.css" rel="stylesheet"></link>
  <link href="/rehainfo/css/variables.css" rel="stylesheet"></link>
	<script src="/rehainfo/js/Common.js?v=1.0.2"></script>
  
    <style>
      body {
        background-color: #E8E9ED;
        font-family: 'Noto Sans JP', sans-serif;
      }
      
      .bd-placeholder-img {
        font-size: 1.125rem;
        text-anchor: middle;
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
      }

      .header {
        background-color: var(--main-color);
        min-height: 60px;
      }

      .icon {
        width: 214px;
      }

      .login-form {
        width: 600px;
        background-color: #FFFFFF;
        padding-top: 50px;
        padding-bottom: 50px;
      }

      .input {
        width: 440px;
      }

      .btn-login {
        border-color: var(--main-color);
        width: 440px;
        background-color: var(--main-color);
        color: #FFFFFF;
        height: 40px;
      }

      .btn-login:hover {
        color: #FFFFFF;
      }

      .ocr-link-button {
        min-width: 90px;
        border: 1px solid #FFFFFF;
        background-color: #FFFFFF;
        color: #1C2950;
        font-weight: 400;
      }

      .ocr-link-button:hover {
        color: white;
        background-color: var(--main-color);
        border-color: white;
      }

      @media (min-width: 768px) {
        .bd-placeholder-img-lg {
          font-size: 3.5rem;
        }
      }
    .loading-overlay {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(255, 255, 255, 0.9);
			display: none;
			justify-content: center;
			align-items: center;
			z-index: 9999;
			flex-direction: column;
		}

		.loading-spinner {
			width: 80px;
			height: 80px;
		}

		/* Spinner ring wrapper */
		.spinner-ring {
			position: relative;
			width: 100px;
			height: 100px;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		/* Circular border (the rotating outline) */
		.spinner-ring::before {
			content: "";
			position: absolute;
			width: 100px;
			height: 100px;
			border: 6px solid #ccc;         /* gray base */
			border-top: 6px solid #202B4C;  /* top colored */
			border-radius: 50%;
			animation: spin 1s linear infinite;
		}

		/* The image stays still */
		.loading-icon {
			width: 60px;
			height: 60px;
			background-image: url("");
			z-index: 1;
		}

		/* Text */
		.loading-text {
			margin-top: 20px;
			font-size: 18px;
			font-weight: 500;
			color: #202B4C;
		}

		/* Rotation animation */
		@keyframes spin {
			0%   { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}
    </style>
</head>
<body>
  <header class="d-flex header align-items-center justify-content-end px-4 gap-2" style="min-width: 330px;">
    <button type="button" class="btn ocr-link-button" onclick="window.open('/rehainfo/prescriptions/patients', '_blank')">AI処方箋</button>
    <button type="button" class="btn ocr-link-button" onclick="window.open('/rehainfo/ocr/login', '_blank')">AIOCR</button>
  </header>

  <main>
    <!--test-->
		<div th:replace="common :: loading"></div>

    <form action="login.html" th:action="@{/login/exec}" th:object="${loginModel}" method="post">        
      <div class="d-flex justify-content-center align-items-center" style="min-height: 200px;">
          <a href="#" class="icon mb-2 mb-lg-0 text-dark text-decoration-none">
              <img src="/rehainfo/images/SmartRehab-R_Available_Transparent.png" width="100%" height="auto" style="max-width: 300px; mix-blend-mode: multiply;"></img>
          </a>
      </div>
      <div class="d-flex justify-content-center">
        <div class="login-form d-flex flex-column align-items-center">
          <div class="mb-3 input">
            <label for="exampleInputEmail1" class="form-label">メールアドレス</label>
            <div class="w-100">
              <input type="email" th:field="*{email}" required="required" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"  placeholder="MailAddress"/>
            </div>
          </div>
          <div class="mb-3 input">
            <label for="exampleInputPassword1" class="form-label">パスワード</label>
            <div class="w-100">
              <input type="password" th:field="*{pass}" required="required" class="form-control" id="exampleInputPassword1"  placeholder="Password"/>
            </div>
          </div>
          <div class="d-flex justify-content-center mb-4">
            <button type="submit" class="btn btn-login" onclick="showLoadingSpinner()">ログイン</button>
          </div>
          <div id="errorMsg" class="flex-columnr text-center" style="color: red;">
            <article th:if="${#fields.hasErrors('all')}" class="d-flex justify-content-center">
              <ul>
                  <li th:each="err : ${#fields.errors('all')}" th:text="${err}" style="color: red;">エラー文言エラー文言</li>
              </ul>
            </article>
            <article th:if="${resultFlg}" >
              <fieldset>
                <legend style="font-size: 16px;">【ログインに失敗しました】</legend>
                <p th:if="${not #lists.isEmpty(ErrorMessage)}" >
                  <label>
                    <span th:text="${ErrorMessage}" th:remove="tag">OK</span>
                  </label>
                </p>
              </fieldset>
            </article>
          </div>
          <p class="d-flex justify-content-center mt-4">
            <a href="/personal/account/password/index">パスワードを忘れた場合はこちら</a>
          </p>
        </div>
      </div>
    </form>
  </main>
</body>
</html>

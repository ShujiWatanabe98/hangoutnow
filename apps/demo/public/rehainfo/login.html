<!DOCTYPE HTML>
<html lang="ja" >
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<meta name="theme-color" content="#1b294e" />
<title>ログイン</title>
<!--[if lt IE 9]>
<script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
<![endif]-->

    <!-- Bootstrap core CSS -->
  <link href="/rehainfo/css/bootstrap.min.css" rel="stylesheet"></link>
  <link href="/rehainfo/css/variables.css" rel="stylesheet"></link>
  
    <style>
      body {
        background-color: #E8E9ED;
        font-family: 'Noto Sans JP', sans-serif;
      }
      
      .bd-placeholder-img {
        font-size: 1.125rem;
        text-anchor: middle;
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
      }

      .header {
        background-color: var(--main-color);
        min-height: 60px;
      }

      .icon {
        width: 214px;
      }

      .login-form {
        width: 600px;
        background-color: #FFFFFF;
        padding-top: 50px;
        padding-bottom: 50px;
      }

      .input {
        width: 440px;
      }

      .btn-login {
        border-color: var(--main-color);
        width: 440px;
        background-color: var(--main-color);
        color: #FFFFFF;
        height: 40px;
      }

      .btn-login:hover {
        color: #FFFFFF;
      }

      .ocr-link-button {
        min-width: 90px;
        border: 1px solid #FFFFFF;
        background-color: #FFFFFF;
        color: #1C2950;
        font-weight: 400;
      }

      .ocr-link-button:hover {
        color: white;
        background-color: var(--main-color);
        border-color: white;
      }

      @media (min-width: 768px) {
        .bd-placeholder-img-lg {
          font-size: 3.5rem;
        }
      }
    .loading-overlay {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(255, 255, 255, 0.9);
			display: none;
			justify-content: center;
			align-items: center;
			z-index: 9999;
			flex-direction: column;
		}

		.loading-spinner {
			width: 80px;
			height: 80px;
		}

		/* Spinner ring wrapper */
		.spinner-ring {
			position: relative;
			width: 100px;
			height: 100px;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		/* Circular border (the rotating outline) */
		.spinner-ring::before {
			content: "";
			position: absolute;
			width: 100px;
			height: 100px;
			border: 6px solid #ccc;         /* gray base */
			border-top: 6px solid #202B4C;  /* top colored */
			border-radius: 50%;
			animation: spin 1s linear infinite;
		}

		/* The image stays still */
		.loading-icon {
			width: 60px;
			height: 60px;
			background-image: url("");
			z-index: 1;
		}

		/* Text */
		.loading-text {
			margin-top: 20px;
			font-size: 18px;
			font-weight: 500;
			color: #202B4C;
		}

		/* Rotation animation */
		@keyframes spin {
			0%   { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}
    </style>
</head>
<body>
  <header class="d-flex header align-items-center justify-content-end px-4 gap-2" style="min-width: 330px;"></header>

  <main>
    <form action="/rehainfo/login" method="post">        
      <div class="d-flex justify-content-center align-items-center" style="min-height: 200px;">
          <a href="#" class="icon mb-2 mb-lg-0 text-dark text-decoration-none">
              <img src="/rehainfo/images/SmartRehab-R_Available_Transparent.png" width="100%" height="auto" style="max-width: 300px; mix-blend-mode: multiply;"></img>
          </a>
      </div>
      <div class="d-flex justify-content-center">
        <div class="login-form d-flex flex-column align-items-center">
          <div class="mb-3 input">
            <label for="exampleInputEmail1" class="form-label">ユーザー名</label>
            <div class="w-100">
              <input type="text" name="username" autocomplete="username" required="required" class="form-control" id="exampleInputEmail1" placeholder="User name" autofocus="autofocus"/>
            </div>
          </div>
          <div class="mb-3 input">
            <label for="exampleInputPassword1" class="form-label">パスワード</label>
            <div class="w-100">
              <input type="password" name="password" autocomplete="current-password" required="required" class="form-control" id="exampleInputPassword1"  placeholder="Password"/>
            </div>
          </div>
          <div class="d-flex justify-content-center mb-4">
            <button type="submit" class="btn btn-login">ログイン</button>
          </div>
          <p id="loginError" class="text-center" style="color: red;" role="alert" hidden="hidden"></p>
          <p class="d-flex justify-content-center mt-4">
            <a href="/">methodmoreホームへ戻る</a>
          </p>
          <p class="text-center text-secondary mt-3" style="font-size: 13px;">rehainfo実装を使用した限定公開デモです。表示内容はすべて架空です。</p>
        </div>
      </div>
    </form>
  </main>
  <script src="/rehainfo/login.js?v=20260910-1" defer="defer"></script>
</body>
</html>

		/* Overlay styles */
		.loading-overlay {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(255, 255, 255, 0.9);
			display: none;
			justify-content: center;
			align-items: center;
			z-index: 9999;
			flex-direction: column;
		}

		.loading-spinner {
			width: 80px;
			height: 80px;
		}

		/* Spinner ring wrapper */
		.spinner-ring {
			position: relative;
			width: 100px;
			height: 100px;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		/* Circular border (the rotating outline) */
		.spinner-ring::before {
			content: "";
			position: absolute;
			width: 100px;
			height: 100px;
			border: 6px solid #ccc;         /* gray base */
			border-top: 6px solid #202B4C;  /* top colored */
			border-radius: 50%;
			animation: spin 1s linear infinite;
		}

		/* The image stays still */
		.loading-icon {
			width: 60px;
			height: 60px;
			background-image: url("");
			z-index: 1;
		}

		/* Text */
		.loading-text {
			margin-top: 20px;
			font-size: 18px;
			font-weight: 500;
			color: #202B4C;
		}

		/* Rotation animation */
		@keyframes spin {
			0%   { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}

		/* 治療実施／治療記録: JS/DOMの読み込み完了まで操作をブロックするため初期表示する。
		   解除は Common.js が html.block-until-loaded を外し、hideLoadingSpinner がdisplay:noneを付与する。 */
		html.block-until-loaded #loadingOverlay {
			display: flex;
		}

	</style>

    <script>window.prescriptionPatientAddFlow = new URLSearchParams(window.location.search).get('flow') === 'patient-add';</script>

    <style>
        body { background: #E8E9ED; font-family: 'Hiragino Kaku Gothic Pro', 'Noto Sans JP', sans-serif; }
        main { padding: 24px; }
        .content { max-width: 1200px; margin: 0 auto; }
        .page-title { font-size: 24px; font-weight: 700; margin: 0; }
        .back-icon { cursor: pointer; margin-right: 12px; }
        .list-card { background: #fff; border-radius: 8px; overflow-x: auto; margin-top: 24px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #F5F5F5; font-size: 14px; text-align: left; padding: 12px 16px; white-space: nowrap; }
        td { border-top: 1px solid #E0E0E0; padding: 16px; vertical-align: top; }
        .result { white-space: pre-wrap; min-width: 360px; line-height: 1.65; }
        .status { display: inline-block; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; }
        .status-done { background: #dcfce7; color: #166534; }
        .status-error { background: #fee2e2; color: #991b1b; }
        .status-reading { background: #dbeafe; color: #1e40af; }
        .warning { color: #92400e; background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; padding: 10px 12px; margin-top: 16px; }
        .actions { display: flex; justify-content: flex-end; margin-top: 16px; }
        .btn-read { background: #1C2950; color: #fff; border: 0; border-radius: 4px; padding: 10px 18px; text-decoration: none; }
        .btn-patient-add { background: #1C2950; color: #fff; border: 0; border-radius: 4px; padding: 9px 14px; font-weight: 600; white-space: nowrap; }
        .empty { text-align: center; padding: 60px 20px; color: #6b7280; }
        .pagination { justify-content: center; gap: 6px; margin-top: 20px; }
        .page-link { color: #1C2950; }
        #prescriptionPatientDialog { width: min(900px, calc(100vw - 32px)); max-height: calc(100vh - 40px); padding: 0; border: 0; border-radius: 10px; box-shadow: 0 24px 80px rgba(0,0,0,.28); }
        #prescriptionPatientDialog::backdrop { background: rgba(13,22,45,.55); }
        .patient-dialog-header { display: flex; justify-content: space-between; gap: 16px; padding: 20px 24px 16px; border-bottom: 1px solid #d9dee8; }
        .patient-dialog-header h2 { margin: 0 0 4px; font-size: 22px; }
        .patient-dialog-header p { margin: 0; color: #59657b; font-size: 13px; }
        .patient-dialog-close { border: 0; background: transparent; font-size: 28px; line-height: 1; }
        .patient-dialog-body { padding: 20px 24px 24px; overflow: auto; }
        .patient-dialog-status { min-height: 24px; margin-bottom: 12px; color: #59657b; }
        .patient-dialog-status.error { color: #b42318; }
        .patient-dialog-status.success { color: #166534; }
        .patient-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
        .patient-form-field { display: flex; flex-direction: column; gap: 5px; }
        .patient-form-field.full { grid-column: 1 / -1; }
        .patient-form-field label { font-size: 13px; font-weight: 700; color: #303b50; }
        .patient-form-field input, .patient-form-field select { min-height: 42px; border: 1px solid #b8c0cf; border-radius: 6px; padding: 8px 10px; }
        .patient-form-field input.invalid, .patient-form-field select.invalid { border-color: #dc2626; background: #fff7f7; }
        .patient-id-lookup-row { display: flex; gap: 8px; align-items: stretch; }
        .patient-id-lookup-row input { flex: 1; min-width: 0; }
        .patient-id-lookup-button { border: 1px solid #1C2950; border-radius: 6px; background: #fff; color: #1C2950; padding: 6px 12px; font-weight: 700; white-space: nowrap; }
        .patient-id-lookup-button:disabled { opacity: .55; cursor: wait; }
        .field-error { min-height: 17px; color: #b42318; font-size: 12px; }
        .required-label { color: #b42318; font-size: 11px; margin-left: 5px; }
        .patient-dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .patient-dialog-actions button { min-height: 42px; border-radius: 6px; padding: 8px 18px; }
        .patient-dialog-cancel { border: 1px solid #8b95a8; background: #fff; color: #303b50; }
        .patient-dialog-submit { border: 1px solid #1C2950; background: #1C2950; color: #fff; font-weight: 700; }
        @media (max-width: 700px) { .patient-form-grid { grid-template-columns: 1fr; } .patient-form-field.full { grid-column: auto; } }

<body data-prescription-page="list">
    <header class="sticky-top" style="z-index:1050;">
		<!-- Google Tag Manager (noscript) -->
		
		<!-- End Google Tag Manager (noscript) -->
		<nav id="gksCommonNavBar" class="navbar navbar-expand-md navbar-light"
			style="background-color: #1C2950; padding: 8px 24px;">
			<div class="container-fluid d-flex justify-content-between align-items-center" style="padding: 0;">
				<div>
					<a href="#" style="text-decoration: none;">
						<img src="/rehainfo/images/ocr/logo.png" class="logo-image" style="width: 53px; height: 30px; object-fit: contain;" />
					</a>
				</div>
				<div>
					<a href="#" onclick="window.location.href='/rehainfo/'; return false;" class="d-flex align-items-center" style="text-decoration: none; color: #FFFFFF; gap: 4px;">
						<span style="font-family: 'Hiragino Kaku Gothic Pro', sans-serif; font-size: 14px; font-weight: 300; line-height: 22px; color: #FFFFFF;">スマートリハを表示</span>
						<img src="/rehainfo/images/icons/ocr/box-arrow-up-right.svg" style="width: 20px; height: 20px; flex-shrink: 0;" alt="" />
					</a>
				</div>
			</div>
		</nav>
	</header>
    <div>
		<div id="loadingOverlay" class="loading-overlay">
			<div class="spinner-ring">
				<img class="loading-spinner" src="/rehainfo/images/intep360.svg" alt="loading" />
			</div>
			<div class="loading-text">処理中......</div>
		</div>
	</div>
    <main>
        <div class="content">
            <h1 class="page-title">
                <i class="bi bi-arrow-left back-icon" onclick="showLoadingSpinner(); window.location.href='/rehainfo/prescriptions/patients' + (window.prescriptionPatientAddFlow ? '?flow=patient-add' : '');"></i>
                <span data-prescription-patient-title>保存済み処方箋</span>
            </h1>
            <div class="warning"><i class="bi bi-exclamation-triangle me-2"></i>電カル取得データとAI読取結果は参考情報です。薬剤名・用量・用法・日数を必ず処方箋原本と照合してください。</div>
            <div class="actions">
                <a class="btn-read" data-prescription-read-link href="/rehainfo/prescriptions/patients"><i class="bi bi-prescription2 me-2"></i>処方箋読込</a>
            </div>

            <div class="list-card">
                <table id="prescription-list-table">
                    <thead><tr><th>処方日</th><th>処方箋データ</th><th>状態</th><th>保存日時</th><th>患者登録</th></tr></thead>
                    <tbody id="prescription-list-body">
                        <tr>
                            <td>2026/09/10</td>
                            <td class="result">
                                <span>読取結果</span>
                                <span>読取エラー</span>
                                <span>AI読取中です</span>
                            </td>
                            <td>
                                <span class="status status-done">保存済み</span>
                                <span class="status status-error">読取エラー</span>
                                <span class="status status-reading">読取中</span>
                            </td>
                            <td>2026/09/10 10:00</td>
                            <td>
                                <button type="button" class="btn-patient-add"
                                    onclick="PrescriptionPatientImport.open(this.getAttribute('data-prescription-id'))">患者として追加</button>
                                <span>―</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="empty" id="prescription-list-empty">
                    <i class="bi bi-prescription2 d-block mb-3" style="font-size: 42px;"></i>
                    保存済みの処方箋はありません
                </div>
            </div>

            <nav id="prescription-list-pagination" aria-label="ページ切替" hidden="hidden">
                <ul class="pagination">
                    <li class="page-item">
                        <a class="page-link">前へ</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link">1</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link">次へ</a>
                    </li>
                </ul>
            </nav>
        </div>
    </main>
    <dialog id="prescriptionPatientDialog" aria-labelledby="prescriptionPatientDialogTitle">
        <div class="patient-dialog-header">
            <div><h2 id="prescriptionPatientDialogTitle">処方箋から患者を追加</h2><p>読取結果を確認し、不足している必須項目を入力してください。</p></div>
            <button type="button" class="patient-dialog-close" aria-label="閉じる">×</button>
        </div>
        <form id="prescriptionPatientForm" class="patient-dialog-body" novalidate="novalidate">
            <div id="prescriptionPatientStatus" class="patient-dialog-status" role="status"></div>
            <div class="patient-form-grid">
                <div class="patient-form-field"><label for="rxPatientId">患者ID<span class="required-label">必須</span></label><div class="patient-id-lookup-row"><input id="rxPatientId" name="patientId" maxlength="64" /><button type="button" id="prescriptionPatientLookup" class="patient-id-lookup-button">患者IDから取得</button></div><div class="field-error" data-error-for="patientId"></div></div>
                <div class="patient-form-field"><label for="rxBirth">生年月日<span class="required-label">必須</span></label><input id="rxBirth" name="birth" type="date" /><div class="field-error" data-error-for="birth"></div></div>
                <div class="patient-form-field"><label for="rxFamilyName">姓<span class="required-label">必須</span></label><input id="rxFamilyName" name="familyName" /><div class="field-error" data-error-for="familyName"></div></div>
                <div class="patient-form-field"><label for="rxFirstName">名<span class="required-label">必須</span></label><input id="rxFirstName" name="firstName" /><div class="field-error" data-error-for="firstName"></div></div>
                <div class="patient-form-field"><label for="rxFamilyNameKana">姓カナ<span class="required-label">必須</span></label><input id="rxFamilyNameKana" name="familyNameKana" /><div class="field-error" data-error-for="familyNameKana"></div></div>
                <div class="patient-form-field"><label for="rxFirstNameKana">名カナ<span class="required-label">必須</span></label><input id="rxFirstNameKana" name="firstNameKana" /><div class="field-error" data-error-for="firstNameKana"></div></div>
                <div class="patient-form-field"><label for="rxGender">性別<span class="required-label">必須</span></label><select id="rxGender" name="gender"><option value="">選択してください</option><option value="男性">男性</option><option value="女性">女性</option><option value="その他">その他</option></select><div class="field-error" data-error-for="gender"></div></div>
                <div class="patient-form-field"><label for="rxEntryExit">入外区分<span class="required-label">必須</span></label><select id="rxEntryExit" name="entryExit"><option value="">選択してください</option><option value="入院">入院</option><option value="外来">外来</option></select><div class="field-error" data-error-for="entryExit"></div></div>
                <div class="patient-form-field"><label for="rxRehabilitationClass">リハビリテーション区分<span class="required-label">必須</span></label><input id="rxRehabilitationClass" name="rehabilitationClass" placeholder="例：運動器（Ⅰ）" /><div class="field-error" data-error-for="rehabilitationClass"></div></div>
                <div class="patient-form-field"><label for="rxRehabilitationStartDate">リハビリ開始日<span class="required-label">必須</span></label><input id="rxRehabilitationStartDate" name="rehabilitationStartDate" type="date" /><div class="field-error" data-error-for="rehabilitationStartDate"></div></div>
                <div class="patient-form-field"><label for="rxHospitalizationStartDate">入院日<span class="required-label" data-inpatient-required="true">入院時必須</span></label><input id="rxHospitalizationStartDate" name="hospitalizationStartDate" type="date" /><div class="field-error" data-error-for="hospitalizationStartDate"></div></div>
                <div class="patient-form-field"><label for="rxWardName">病棟名<span class="required-label" data-inpatient-required="true">入院時必須</span></label><input id="rxWardName" name="wardName" /><div class="field-error" data-error-for="wardName"></div></div>
                <div class="patient-form-field full"><label for="rxPrimaryDiagnosis">主病名</label><input id="rxPrimaryDiagnosis" name="primaryDiagnosis" /><div class="field-error" data-error-for="primaryDiagnosis"></div></div>
            </div>
            <div class="patient-dialog-actions"><button type="button" class="patient-dialog-cancel">キャンセル</button><button type="submit" id="prescriptionPatientSubmit" class="patient-dialog-submit">患者として追加</button></div>
        </form>
    </dialog>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#202b4c" />
  <link rel="canonical" href="https://method-more.com/rehainfo/" />
  <title>担当患者一覧</title>
  <link href="/rehainfo/css/bootstrap.min.css?v=source-20260910" rel="stylesheet" />
  <link href="/rehainfo/css/bootstrap-icons-1.9.1/bootstrap-icons.css?v=source-20260910" rel="stylesheet" />
  <link href="/rehainfo/css/variables.css?v=source-20260910" rel="stylesheet" />
  <link href="/rehainfo/patient-list-source.css?v=20260910-1" rel="stylesheet" />
  <script src="/rehainfo/js/bootstrap.bundle.min.js?v=source-20260910" defer></script>
  <script src="/rehainfo/patient-list-source.js?v=20260910-1" defer></script>
</head>
<body>
  <header class="sticky-top source-header">
    <nav id="gksCommonNavBar" class="navbar navbar-expand-md navbar-light">
      <div class="container-fluid">
        <div class="d-flex align-items-center source-header-primary">
          <a href="/rehainfo/" class="navbar-brand bg-white" aria-label="Smart Rehab 患者一覧">
            <img src="/rehainfo/images/SmartRehab-R_Available_Transparent.png" class="logo-image" alt="Smart Rehab®" />
          </a>
          <a href="/rehainfo/schedule#schedule" class="btn header-button gks-modify-header-btn ms-2">スケジュール</a>
          <a href="#therapists" class="btn header-button gks-modify-header-btn ms-2" data-demo-action="療法士一覧">療法士一覧</a>
        </div>
        <div class="source-header-actions">
          <button type="button" class="btn header-button gks-modify-header-btn" data-demo-action="AI処方箋">AI処方箋</button>
          <button type="button" class="btn header-button gks-modify-header-btn" data-demo-action="AIOCR">AIOCR</button>
          <button type="button" class="btn gks-setting-btn" aria-label="設定" data-demo-action="設定"><i class="bi bi-gear-fill"></i></button>
          <button type="button" class="btn header-button gks-modify-header-btn" data-demo-action="個人ノート">個人ノート</button>
          <button type="button" class="btn header-button gks-modify-header-btn" data-demo-action="患者登録">患者登録</button>
          <div class="dropdown">
            <button class="btn dropdown-toggle gks-user-profile-btn" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false" aria-label="ユーザーメニュー"><i class="bi bi-person-fill"></i></button>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
              <li class="dropdown-header">公開デモ</li>
              <li><a class="dropdown-item" href="/rehainfo/logout"><i class="bi bi-box-arrow-right me-2"></i>ログアウト</a></li>
            </ul>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <div class="title-list"><span class="title-list-rectangle" aria-hidden="true"></span>患者一覧</div>

  <main>
    <div class="container-fluid container-table">
      <section class="search-frame" id="filters">
        <div class="accordion accordion-flush" id="searchAccordion">
          <div class="accordion-item">
            <h2 class="accordion-header" id="searchHeader">
              <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#searchCollapse" aria-expanded="true" aria-controls="searchCollapse">検索条件</button>
            </h2>
            <div id="searchCollapse" class="accordion-collapse collapse show" aria-labelledby="searchHeader">
              <div class="accordion-body row">
                <div class="col-lg-9">
                  <ul class="list-group list-group-flush" id="search_condition_list">
                    <li class="list-group-item border-0">
                      <div class="row align-items-center"><label class="col-2" for="condition_patientName">患者氏名（カナ）</label><div class="col-6"><input type="text" class="form-control" id="condition_patientName" /></div></div>
                    </li>
                    <li class="list-group-item border-0">
                      <div class="row align-items-center"><label class="col-2" for="condition_patientId">患者ID</label><div class="col-6"><input type="text" class="form-control" id="condition_patientId" /></div></div>
                    </li>
                    <li class="list-group-item border-0 additional-condition" id="additionalCondition" hidden>
                      <div class="row align-items-center"><label class="col-2" id="additionalConditionLabel" for="additionalConditionValue"></label><div class="col-6"><input type="text" class="form-control" id="additionalConditionValue" /></div></div>
                    </li>
                  </ul>
                </div>
                <div class="col-lg-3 px-3 condition-selector">
                  <label for="select_additional">条件追加</label>
                  <select class="form-select" id="select_additional">
                    <option value="">追加条件選択</option>
                    <option value="institution">医療機関名</option>
                    <option value="name">患者氏名（漢字）</option>
                    <option value="gender">性別</option>
                    <option value="birth">生年月日</option>
                    <option value="age">年齢</option>
                    <option value="rehabClass">リハビリテーション区分</option>
                    <option value="startDate">起算日</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="patient-list-area" aria-labelledby="patientListCaption">
        <div class="patient-list-tools">
          <div class="form-check form-switch form-check-inline">
            <input class="form-check-input radio-switch" type="checkbox" id="radio_api" checked />
            <label class="form-check-label" for="radio_api">担当患者</label>
          </div>
          <span class="demo-data-label">公開デモ・すべて架空の患者データ</span>
        </div>
        <div id="patientListNotice" class="patient-list-notice" role="status" aria-live="polite"></div>
        <div class="table-responsive">
          <table class="table table-hover dataTable" id="patientListTable">
            <caption id="patientListCaption" class="visually-hidden">担当患者一覧</caption>
            <thead class="table-light"><tr><th>患者ID</th><th>患者氏名</th><th>性別</th><th>生年月日</th><th>年齢</th><th>リハビリテーション区分</th><th>起算日</th><th>入外区分</th><th>病棟名</th><th></th></tr></thead>
            <tbody id="patientListRows"></tbody>
          </table>
        </div>
        <p id="patientListEmpty" class="patient-list-empty" hidden>患者が見つかりません。</p>
      </section>
    </div>
  </main>

  <div class="modal fade" id="patientDetailModal" tabindex="-1" aria-labelledby="patientDetailTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title fs-5" id="patientDetailTitle">患者情報</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button></div>
      <div class="modal-body" id="patientDetailBody"></div>
      <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">閉じる</button></div>
    </div></div>
  </div>
</body>
</html>

		/* Overlay styles */
		.loading-overlay {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(255, 255, 255, 0.9);
			display: none;
			justify-content: center;
			align-items: center;
			z-index: 9999;
			flex-direction: column;
		}

		.loading-spinner {
			width: 80px;
			height: 80px;
		}

		/* Spinner ring wrapper */
		.spinner-ring {
			position: relative;
			width: 100px;
			height: 100px;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		/* Circular border (the rotating outline) */
		.spinner-ring::before {
			content: "";
			position: absolute;
			width: 100px;
			height: 100px;
			border: 6px solid #ccc;         /* gray base */
			border-top: 6px solid #202B4C;  /* top colored */
			border-radius: 50%;
			animation: spin 1s linear infinite;
		}

		/* The image stays still */
		.loading-icon {
			width: 60px;
			height: 60px;
			background-image: url("");
			z-index: 1;
		}

		/* Text */
		.loading-text {
			margin-top: 20px;
			font-size: 18px;
			font-weight: 500;
			color: #202B4C;
		}

		/* Rotation animation */
		@keyframes spin {
			0%   { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}

		/* 治療実施／治療記録: JS/DOMの読み込み完了まで操作をブロックするため初期表示する。
		   解除は Common.js が html.block-until-loaded を外し、hideLoadingSpinner がdisplay:noneを付与する。 */
		html.block-until-loaded #loadingOverlay {
			display: flex;
		}

	</style>

				</div>
			</div>
		</div>
		
	</div>
	<div id="patientDischargeNotice" class="alert alert-success" role="status" hidden="hidden"></div>
	<div class="modal fade" id="patientDischargeModal" tabindex="-1"
		aria-labelledby="patientDischargeModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="patientDischargeModalLabel">退院日の設定</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
				</div>
				<div class="modal-body">
					<div class="patient-discharge-summary mb-3">
						<strong id="patientDischargePatientName"></strong>
						<span id="patientDischargePatientId"></span>
						<span>入院日：<span id="patientDischargeAdmissionDate" class="d-inline"></span></span>
					</div>
					<p>退院日を入力すると、患者情報の「退院日」へ自動的に保存されます。</p>
					<label for="patientDischargeDate" class="form-label fw-bold">退院日</label>
					<input type="date" id="patientDischargeDate" class="form-control" required="required" />
					<div id="patientDischargeError" class="alert alert-danger mt-3 mb-0" role="alert" hidden="hidden"></div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">キャンセル</button>
					<button type="button" class="btn btn-danger" id="patientDischargeSubmit">退院する</button>
				</div>
			</div>
		</div>
	</div>
	<div class="title-list">
        <div class="title-list-rectangle">
        </div>
        患者一覧
    </div>
	<main>
		<!-- Modal -->
		<div class="modal fade" id="treatmentConfirmaition" tabindex="-1"
			aria-labelledby="treatmentConfirmaitionLabel" aria-hidden="true">
			<div class="modal-dialog custom-modal-dialog">
				<div class="modal-content">
					<div class="modal-body d-flex flex-column align-items-center gap-3">
						<img class="mx-auto d-block" src="/rehainfo/images/warning_icon.svg"></img>
						<h5>時間計測を実施しますか？</h5>
					</div>
					<div class="modal-footer" style="border-top: none; display: flex; gap: 8px;">
						<button id="treatmentImplementModalButton" type="button" class="btn btn-custom btn-main" style="flex: 1;">はい</button>

						<button type="button" class="btn btn-custom btn-outline-main" style="flex: 1;">いいえ</button>

						<button type="button" class="btn btn-custom btn-outline-main" style="flex: 1;"
							data-bs-dismiss="modal">キャンセル</button>
					</div>
				</div>
			</div>
		</div>
		<div class="container-fluid container-table">
			<div class="row border-bottom py-3" id="filters">
				<div class="accordion accordion-flush" id="searchAccordion">
					<div class="accordion-item">
						<h2 class="accordion-header" id="searchHeader">
							<button class="accordion-button" type="button" style="width: 100%; font-size: 75%; font-weight:bold;" data-bs-toggle="collapse"
								data-bs-target="#searchCollapse" aria-expanded="true" aria-controls="searchCollapse">
								検索条件
							</button>
						</h2>
						<form action="" method="GET" id="list-form">
							<div id="searchCollapse" class="accordion-collapse collapse show" aria-labelledby="searchHeader">
								<div class="accordion-body row">
									<div class="col-lg-9">
										<ul class="list-group list-group-flush" id="search_condition_list">
											<li class="list-group-item border-0">
												<div class="row">
													<div class="col-2">患者氏名（カナ）</div>
													<div class="col-6">
														<input type="text" name="patientNameKana" class="form-control" id="condition_patientName" onchange="onChangeInput();" />
													</div>
												</div>
											</li>
											<li class="list-group-item border-0">
												<div class="row">
													<div class="col-2">患者ID</div>
													<div class="col-6">
														<input type="text" name="patientId" class="form-control" id="condition_patientId" onchange="onChangeInput();" />
													</div>
												</div>
											</li>
										</ul>
									</div>
									<div class="col-lg-3 px-3">
										<div class="row" id="selecter">
											<div>条件追加</div>
											<script type="text/javascript">
												/*<![CDATA[*/
													addSearcher("selecter", null, null, null, null);
												/*]]>*/
											</script>
										</div>
									</div>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
			<div class="row pt-1">
				<div id="patientList-area">
					<form action="" method="POST" id="api-type-form">
						<ul>
							<div class="form-check form-switch form-check-inline">
								<input class="form-check-input radio-switch" type="checkbox" id="radio_api" onchange="onChangeInput();"/>
								<label class="form-check-label" for="radio_api">担当患者</label>
							  </div>
						</ul>
						<script type="text/javascript">
							/*<![CDATA[*/
								switchToggle(true);
							/*]]>*/
						</script>
					</form>
					<div id="table-div">
						<script type="text/javascript">
						/*<![CDATA[*/
							$(function(){
								let elements = $("#table-div");
								if (elements.length > 0) {
									let parentNode = elements[0]; 
									addPatientListTable(parentNode, window.REHAINFO_DEMO_PATIENT_COLUMNS, window.REHAINFO_DEMO_PATIENTS, 'PhysicalTherapist');
								} 
							})
						/*]]>*/
						</script>
						
					</div>
					<div>
						<p></p>
						<p></p>
					</div>
					<form action="" method="GET" name="record-form">
						<!-- レーダーチャート表示用変数. この時点では表示する2点は不明なので空のまま -->
						<input type="hidden" name="date1" value=""/>
						<input type="hidden" name="date2" value=""/>
						<input id="patientFitbit" type="hidden" name="fitbit" value=""/>
						<input id="patientDisplayDiv" type="hidden" name="displayDiv" value=""/>
						<input id="patientGroupId" type="hidden" name="groupId" value=""/>
					</form>
				</div>
			</div>
		</div>
	</main>
</body>

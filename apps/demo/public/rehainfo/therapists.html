		/* Overlay styles */
		.loading-overlay {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(255, 255, 255, 0.9);
			display: none;
			justify-content: center;
			align-items: center;
			z-index: 9999;
			flex-direction: column;
		}

		.loading-spinner {
			width: 80px;
			height: 80px;
		}

		/* Spinner ring wrapper */
		.spinner-ring {
			position: relative;
			width: 100px;
			height: 100px;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		/* Circular border (the rotating outline) */
		.spinner-ring::before {
			content: "";
			position: absolute;
			width: 100px;
			height: 100px;
			border: 6px solid #ccc;         /* gray base */
			border-top: 6px solid #202B4C;  /* top colored */
			border-radius: 50%;
			animation: spin 1s linear infinite;
		}

		/* The image stays still */
		.loading-icon {
			width: 60px;
			height: 60px;
			background-image: url("");
			z-index: 1;
		}

		/* Text */
		.loading-text {
			margin-top: 20px;
			font-size: 18px;
			font-weight: 500;
			color: #202B4C;
		}

		/* Rotation animation */
		@keyframes spin {
			0%   { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}

		/* 治療実施／治療記録: JS/DOMの読み込み完了まで操作をブロックするため初期表示する。
		   解除は Common.js が html.block-until-loaded を外し、hideLoadingSpinner がdisplay:noneを付与する。 */
		html.block-until-loaded #loadingOverlay {
			display: flex;
		}

	</style>

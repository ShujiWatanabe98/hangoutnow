services:
  - type: web
    # Keep this compatibility-stable Render resource name because released
    # clients use its onrender.com hostname. The runtime product name is
    # MethodMore Platform and all public products are served by this instance.
    name: hangoutnow-api
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: METHODMORE_PLATFORM_NAME
        value: methodmore-platform
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        # Managed manually so the shared paid instance can use the
        # application-specific `hangoutnow` schema without colliding with
        # SalonRecord's tables in `public`.
        sync: false
      - key: METHODMORE_SHARED_DATABASE_URL
        # Base connection URL for SalonRecord and AI OCR. Unlike Prisma's
        # application URL, this value does not select the hangoutnow schema.
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: LINE_LOGIN_CHANNEL_ID
        value: "2011130010"
      - key: LINE_LOGIN_CHANNEL_SECRET
        sync: false
      - key: LINE_LOGIN_CALLBACK_URL
        value: https://hangoutnow-api.onrender.com/auth/line/callback
      - key: GOOGLE_LOGIN_CLIENT_ID
        sync: false
      - key: GOOGLE_LOGIN_CLIENT_SECRET
        sync: false
      - key: GOOGLE_LOGIN_CALLBACK_URL
        value: https://hangoutnow-api.onrender.com/auth/google/callback
      - key: APPLE_LOGIN_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: APPLE_LOGIN_CALLBACK_URL
        value: https://hangoutnow-api.onrender.com/auth/apple/callback
      - key: X_LOGIN_CLIENT_ID
        sync: false
      - key: X_LOGIN_CLIENT_SECRET
        sync: false
      - key: X_LOGIN_CALLBACK_URL
        value: https://hangoutnow-api.onrender.com/auth/x/callback
      - key: CORS_ORIGINS
        value: https://method-more.com,https://www.method-more.com,https://hangoutnow-demo.onrender.com
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NEWSLETTER_FROM_EMAIL
        sync: false
      - key: PUBLIC_SITE_URL
        value: https://method-more.com
      - key: NEXT_PUBLIC_ROBOREHA_BASE_PATH
        value: /roboreha-app
      - key: ROBOREHA_DB_SCHEMA
        value: roboreha
      - key: ROBOREHA_VIDEO_STORAGE_MODE
        value: local
      - key: MAPBOX_APIKEY
        sync: false
      - key: ROBOREHA_ROUTE_PATH
        value: /roboreha-app
      - key: ROBOREHA_UPSTREAM_ORIGIN
        value: http://127.0.0.1:3101
      - key: ROBOREHA_USERNAME
        sync: false
      - key: ROBOREHA_PASSWORD
        sync: false
      - key: ROBOREHA_SESSION_SECRET
        sync: false
      - key: ROBOREHA_PROXY_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: OPENAI_IMAGE_DETAIL
        value: high
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SALON_NAME
        sync: false
      - key: SEED_DEMO_DATA
        sync: false
      - key: SESSION_TTL_DAYS
        sync: false
      - key: SYSTEM_ADMIN_ID
        sync: false
      - key: SYSTEM_ADMIN_PASSWORD
        sync: false
      - key: AIOCR_ENCRYPTION_KEY
        sync: false
      - key: AIOCR_FACILITY_ID
        sync: false
      - key: AIOCR_IMAGE_RETENTION_DAYS
        sync: false
      - key: AIOCR_USERNAME
        sync: false
      - key: AIOCR_PASSWORD
        sync: false
      - key: AIOCR_DATA_DIR
        value: /tmp/methodmore-platform/aiocr/data
      - key: AIOCR_BACKUP_DIR
        value: /tmp/methodmore-platform/aiocr/backups
      - key: AIOCR_BASE_PATH
        value: /ai-ocr

  - type: web
    name: hangoutnow-demo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w @hangout-now/admin
    startCommand: npm start -w @hangout-now/demo
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: API_URL
        value: https://hangoutnow-api.onrender.com
      - key: MAPBOX_APIKEY
        sync: false
      - key: ROBOREHA_ROUTE_PATH
        value: /roboreha-app
      - key: ROBOREHA_UPSTREAM_ORIGIN
        # RoboCareOne now runs inside the existing paid API service.
        # Keep the standalone free service until the merged release is verified.
        value: https://hangoutnow-api.onrender.com

  - type: web
    name: methodmore-roboreha-private
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w @method-more/roboreha
    startCommand: npm start -w @method-more/roboreha
    healthCheckPath: /roboreha-app/api/healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_ROBOREHA_BASE_PATH
        value: /roboreha-app
      - key: DB_SCHEMA
        value: roboreha
      # Compatibility mode for the existing free service. The API reports
      # durable=false until the private S3-compatible bucket is configured.
      - key: ROBOREHA_VIDEO_STORAGE_MODE
        value: local
      - key: DATABASE_URL
        fromDatabase:
          name: shared-postgres
          property: connectionString

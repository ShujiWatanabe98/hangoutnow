services:
  - type: web
    name: hangoutnow-api
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        # Managed manually so the shared paid instance can use the
        # application-specific `hangoutnow` schema without colliding with
        # SalonRecord's tables in `public`.
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: PHONE_CODE_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://method-more.com,https://www.method-more.com,https://hangoutnow-demo.onrender.com
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false

  - type: web
    name: hangoutnow-demo
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start -w @hangout-now/demo
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: API_URL
        value: https://hangoutnow-api.onrender.com
